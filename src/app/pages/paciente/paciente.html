<!--Contenedor principal-->
<div class="p-4">
  <!-- Cabecera superior que alinea el título principal del portal y el botón de cierre de sesión -->
  <div class="flex justify-content-between align-items-center mb-4">
    <h2>Portal del Paciente</h2>
    <p-button 
      label="Cerrar Sesión" 
      icon="pi pi-sign-out" 
      severity="danger" 
      (click)="cerrarSesion()">
    </p-button>
  </div>

  <!-- Sección de título de turnos reservados y botón para solicitar turno nuevo -->
  <div class="flex justify-content-between align-items-center mb-3">
    <h3>Mis Turnos Reservados</h3>
    <p-button 
      label="Solicitar Nuevo Turno" 
      icon="pi pi-plus" 
      severity="success"
      (click)="irSolicitarTurno()">
    </p-button>
  </div>

  <!-- Tabla principal de turnos -->
  <p-table [value]="turnosPaciente()" [loading]="cargando()" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>N° Reserva</th>
        <th>Médico</th>
        <th>Fecha y Hora</th>
        <th>Valor</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-turno>
      <tr>
        <td>{{ turno.idReserva }}</td>
        <td>{{ turno.nombreMedico }} {{ turno.apellidoMedico }}</td>
        <td>{{ turno.fechaTurno }}</td>
        <td>${{ turno.valorConsulta }}</td>
        <td>
          <!-- Columna de estado con insignia dinámica según el estado del turno -->
          <span class="p-badge" [ngClass]="{'p-badge-success': turno.estado === 'ACTIVO', 'p-badge-danger': turno.estado === 'CANCELADO'}">
            {{ turno.estado }}
          </span>
        </td>
        <td>
          <!-- Columna de acciones, permite cancelar solo si el turno está activo -->
          <p-button 
            *ngIf="turno.estado === 'ACTIVO'"
            label="Cancelar Turno" 
            icon="pi pi-trash" 
            severity="danger" 
            size="small"
            (click)="cancelarTurno(turno)">
          </p-button>
        </td>
      </tr>
      <!-- Plantilla que se muestra cuando el listado de turnos está vacío -->
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="text-center">No posees turnos agendados por el momento.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
