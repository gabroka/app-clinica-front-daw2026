<p-confirmpopup />
<p-table [value]="turnos" [rows]="5">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="idReserva">Id turno</th>
      <th pSortableColumn="idMedico">Medico</th>
      <th pSortableColumn="idPaciente">Paciente</th>
      <th pSortableColumn="fecha">Fecha</th>
      <th style="width: 4em"></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-dato>
    <tr>
      <td>{{ dato.idTurno }}</td>
      <td>{{ dato.medico }}</td>
      <td>{{ dato.paciente }}</td>
      <td>{{ dato.fecha }}</td>
      <td>
        <p-button
          type="button"
          [text]="true"
          [rounded]="true"
          icon="pi pi-trash"
          severity="danger"
          (onClick)="cancelarTurno($event, dato)"
        />
      </td>
    </tr>
  </ng-template>
</p-table>
<p-button
  type="button"
  [text]="true"
  [rounded]="true"
  icon="pi pi-times"
  label="Cerrar"
  (onClick)="closeDialog()"
/>
<p-toast></p-toast>

<p-confirmdialog>
  <ng-template pTemplate="message" let-message>
    <div class="flex flex-column align-items-center margin-top-0 w-full gap-3 border-bottom-1 surface-border">
      <i class="pi pi-exclamation-circle text-6xl text-red-500"></i>
      <p>{{ message.message }}</p>
      <small class="text-gray-500">Recuerda: esta acción no se puede deshacer.</small>
    </div>
  </ng-template>
</p-confirmdialog>
