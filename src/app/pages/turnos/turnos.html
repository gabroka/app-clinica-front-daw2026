<!-- FORMULARIO -->
<main class="container my-5">
  <h2 class="text-center text-primary mb-4 fw-bold">Formulario de Reserva</h2>
  <!-- Formulario reactivo vinculado a la propiedad form mediante [formGroup] -->
  <form
    [formGroup]="form"
    id="formReserva"
    class="card row g-3 p-4 shadow"
    style="background-color: #e8fdf7; border: 2px solid #31a387">
    <!-- Campo de Nombre y Apellido: renderizado condicional según el rol del usuario -->
    <div class="col-md-6">
      <label class="form-label fw-semibold">Nombre y Apellido:</label>
      @if (rol()) {
        <select class="form-select" formControlName="nombre">
          @for (p of paciente(); track p.id) {
            <option [ngValue]="p.id">
              {{ p.nombres }} {{ p.apellidos }} DNI: {{ p.documento }}
            </option>
          }
        </select>
      } @else {
        <input
          type="text"
          id="nombrePaciente"
          formControlName="nombre"
          class="form-control"
          required
        />
      }
    </div>
    <!-- Campo de Documento, se muestra únicamente si el usuario no es administrador-->
    @if (!rol()) {
      <div class="col-md-6">
        <label class="form-label fw-semibold">Documento:</label>
        <input
          type="text"
          id="documentoPaciente"
          formControlName="documento"
          class="form-control"
          required
        />
      </div>
    }

    <!-- Selector desplegable para elegir el profesional médico -->
    <div class="col-md-6">
      <label class="form-label fw-semibold">Médico:</label>
      <select id="medicoSelect" class="form-select" formControlName="medicoId" required>
        @for (medico of medicos(); track medico.idMedico) {
          <option [ngValue]="medico.idMedico">Dr. {{ medico.nombre }} {{ medico.apellido }}</option>
        }
      </select>
    </div>

    <!-- Campo de solo lectura o edición para el valor monetario de la consulta -->
    <div class="col-md-6">
      <label class="form-label fw-semibold">Valor de la consulta</label>
      <input type="text" id="valorConsulta" formControlName="precioConsulta" class="form-control" />
    </div>

    <!-- Selector de fecha con restricciones de fecha mínima y máxima -->
    <div class="col-md-6">
      <label class="form-label fw-semibold" for="fechaTurno">fecha:</label>
      <input
        style="display: block"
        type="date"
        [min]="fechaMin"
        [max]="fechaMax"
        name="fechaTurno"
        id="fechaTurno"
        formControlName="fecha"
        required
      />
    </div>

    <!-- Selector de horarios disponibles para el turno seleccionado -->
    <div class="col-md-6">
      <label class="form-label fw-semibold" for="horaTurno">Turno disponible:</label>
      <select id="horaTurno" class="form-select" formControlName="hora" required>
        @for (h of horariosDisponibles(); track h) {
          <option [ngValue]="h">{{ h }}</option>
        }
      </select>
    </div>
<!-- Botones de acción -->
    <div class="col-12 mt-3 text-center d-flex justify-content-center gap-2 flex-wrap">
      <button type="submit" class="btn btn-success"  (click)="confirmarReserva()">
        <i class="pi pi-check-circle"></i>
        Confirmar Reserva
      </button>
      
      <!-- Botones condicionales con @if / @else -->
      @if (rol()) {
        <button type="button" class="btn btn-secondary" (click)="volverAlAdmin()">
          <i class="pi pi-arrow-left"></i>
          Volver al Admin
        </button>
      } @else {
        <button type="button" class="btn btn-secondary" (click)="logout()">
          <i class="pi pi-sign-out"></i>
          Cerrar Sesión
        </button>
      }
    </div>
    <div id="resumenReserva" class="mt-5"></div>
  </form>
</main>
